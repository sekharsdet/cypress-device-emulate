name: Release

# Publishes to npm when a `vX.Y.Z` tag is pushed. The tag is the source of
# truth for what gets published — this does not run on every push to main,
# only on an explicit, versioned tag (create one with `git tag vX.Y.Z && git
# push --tags` after bumping "version" in package.json and updating
# CHANGELOG.md). Requires an NPM_TOKEN repo secret with "Automation" publish
# rights on the cypress-device-emulate package.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # id-token: write enables npm provenance — a verifiable, signed
      # attestation that ties the published tarball back to this exact
      # workflow run and commit, viewable on the npm package page.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
