name: Release

# Publishes to npm when a `vX.Y.Z` tag is pushed. The tag is the source of
# truth for what gets published — this does not run on every push to main,
# only on an explicit, versioned tag (create one with `git tag vX.Y.Z && git
# push --tags` after bumping "version" in package.json and updating
# CHANGELOG.md). Requires an NPM_TOKEN repo secret with "Automation" publish
# rights on the cypress-device-emulate package.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # id-token: write enables npm provenance — a verifiable, signed
      # attestation that ties the published tarball back to this exact
      # workflow run and commit, viewable on the npm package page.
      id-token: write
      # contents: write is needed to create the GitHub Release below.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract CHANGELOG section for this version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$TAG_VERSION]" '
            $0 ~ "^" ver { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      # Publishing a GitHub Release (not just a git tag) is what makes a
      # version show up in the repo's Releases feed, watcher notifications,
      # and the "Latest" badge — a pushed tag alone is invisible to all of
      # that.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
